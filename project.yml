name: CardinalDirections
options:
  bundleIdPrefix: edu.stanford.cardinaldirections
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  CardinalDirections:
    type: application
    platform: iOS
    sources:
      - path: CardinalDirections/Sources
      - path: CardinalDirections/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.stanford.cardinaldirections
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Cardinal Directions
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Cardinal Directions uses your location to show the Marguerite buses closest to you and to plan your trip from where you are.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CardinalDirectionsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CardinalDirections/Tests
    dependencies:
      - target: CardinalDirections
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.stanford.cardinaldirections.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  CardinalDirections:
    build:
      targets:
        CardinalDirections: all
        CardinalDirectionsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CardinalDirectionsTests
